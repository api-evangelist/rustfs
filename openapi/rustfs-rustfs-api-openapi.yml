components:
  schemas:
    PostRustfsAdminV3V3IdRequest:
      type: object
      properties:
        recursive:
          type: boolean
          description: Whether to recursively heal; required for root heal or when not naming pool and set
        dryRun:
          type: boolean
          description: Run in dry-run mode
        remove:
          type: boolean
          description: Remove corrupted objects
        recreate:
          type: boolean
          description: Recreate objects
        scanMode:
          type: string
          description: Scanning mode for healing
        updateParity:
          type: boolean
          description: Update parity
        readRepair:
          type: boolean
          description: Enable read repair
        pool:
          type: string
          description: Pool index for erasure set heal
        set:
          type: string
          description: Set index for erasure set heal
    PostRustfsAdminV3RebalanceRebalanceidResponse:
      type: object
      properties:
        id:
          type: string
          description: UUID of the rebalance operation
    PostRustfsAdminV3IdpBuiltinPolicyPolicyidRequest:
      type: object
      properties:
        policies:
          type: array
          description: List of policy names to attach
        user:
          type: string
          description: User name (or use group instead)
        group:
          type: string
          description: Group name (or use user instead)
      required:
      - policies
    GetRustfsAdminV3OidcProvidersResponse:
      type: object
      properties:
        providers:
          type: array
    PutRustfsAdminV3V3IdRequest:
      type: object
      properties:
        policy:
          type: object
          description: Policy JSON document
      required:
      - policy
